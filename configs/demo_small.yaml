# Runnable smoke test. Not a scientific arm -- exercises the full pipeline
# (data -> adapters -> loss curve) on a small GPU so a reader can verify the
# code executes before committing real compute.
#   python -m src.data.build_dataset --arm B1_sparse_clade --out data/demo.jsonl --limit 300
#   python -m src.train.lora_finetune --config configs/demo_small.yaml
model: evo2_1b_base
data: data/demo.jsonl
max_length: 1600
batch_size: 2
grad_accum: 4
lr: 2.0e-4
epochs: 1
warmup_ratio: 0.1
seed: 0
val_fraction: 0.2         # total held back
novel_share: 0.5          # half to val_novel (species-disjoint), half to val_seen
early_stopping_patience: 1
out_dir: results/demo
lora:
  rank: 8
  alpha: 16
  dropout: 0.05
  # Target names verified against ArcInstitute/evo2 -> Zymrael/vortex
  # StripedHyena source (vortex/model/{model,layers,attention}.py):
  #   attention blocks: inner_mha_cls.{Wqkv, out_proj}
  #   all blocks:       mlp.{l1, l2, l3}   (gated MLP: l1/l2 up, l3 down)
  #   hyena blocks:     out_filter_dense
  # blocks.N.projections is TELinear, which subclasses nn.Module (not
  # nn.Linear) and returns (out, bias) -- deliberately excluded.
  target_modules: [inner_mha_cls.Wqkv, inner_mha_cls.out_proj, mlp.l1, mlp.l2, mlp.l3, out_filter_dense]
