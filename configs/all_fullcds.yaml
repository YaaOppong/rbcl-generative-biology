# ALL full-CDS rbcL in GenBank -- no cap, no clade selection.
#
# Built by src.data.discover_accessions (17,205 accessions / 10,770 species) then
# src.data.build_dataset --arm ALL_fullcds. Composition is GenBank's own: ~60%
# vascular plants, ~33% algae, against Evo 2's own 95/5. Nothing here depends on
# the retired manifest's unreproducible arm assignment or its 780 cap.
#
# QC: 3'-complete (src.eval.metrics.is_full_length -- the SAME predicate that
# scores generations), unambiguous bases, exact duplicates removed. NO start
# codon requirement: see configs/all_fullcds_atg.yaml, which is the paired arm
# that tests whether that matters.

model: evo2_7b
data: data/all_fullcds.jsonl
max_length: 1600
batch_size: 4
grad_accum: 8
lr: 1.0e-4
epochs: 3
warmup_ratio: 0.03
seed: 0
val_fraction: 0.2         # total held back
novel_share: 0.5          # half to val_novel (species-disjoint), half to val_seen
early_stopping_patience: 2
out_dir: results/all_fullcds_seed0
lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  # Target names verified against ArcInstitute/evo2 -> Zymrael/vortex
  # StripedHyena source (vortex/model/{model,layers,attention}.py):
  #   attention blocks: inner_mha_cls.{Wqkv, out_proj}
  #   all blocks:       mlp.{l1, l2, l3}   (gated MLP: l1/l2 up, l3 down)
  #   hyena blocks:     out_filter_dense
  # blocks.N.projections is TELinear, which subclasses nn.Module (not
  # nn.Linear) and returns (out, bias) -- deliberately excluded.
  target_modules: [inner_mha_cls.Wqkv, inner_mha_cls.out_proj, mlp.l1, mlp.l2, mlp.l3, out_filter_dense]
